name: Daily News Briefing (Email + Site)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [news-briefing]

concurrency:
  group: daily-briefing
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: 'mailto:tjrlwns93@ermore.co.kr'
          PUBLISH_SITE: '1'
          SEND_EMAIL: '0'
          SITE_URL: 'https://kkkkkijun.github.io/stock_news_mailer/'
        run: python main.py
      - name: Publish site (commit docs/index.html)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          git diff --staged --quiet || git commit -m "site: 브리핑 갱신 [skip ci]"
          git pull --rebase --autostash origin main || true
          git push
