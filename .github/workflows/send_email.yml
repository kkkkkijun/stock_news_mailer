name: Daily US Stock News (Email)

on:
  schedule:
    # 오전 7:37 (한국 시간 기준) → UTC 22:37
    - cron: '37 22 * * *'
    # 오후 5:13 (한국 시간 기준) → UTC 08:13
    - cron: '13 8 * * *'
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run script
        env:
          SEND_CHANNEL: email
          SEND_EMAIL: '0'          # 알림은 앱 푸시로 대체(이메일 끔). 되살리려면 '1'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: mailto:tjrlwns93@ermore.co.kr
        run: python main.py
