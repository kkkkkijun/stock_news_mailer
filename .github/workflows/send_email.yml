name: Daily News Briefing (Email + Site)

on:
  schedule:
    # 오전 6:05 (한국 시간 기준) → UTC 21:05
    # (GitHub Actions 예약 지연 + 실행시간 ≈ 1시간 고려해, 7:00~7:30 도착 목표로 앞당김)
    - cron: '5 21 * * *'
    # 오후 4:13 (한국 시간 기준) → UTC 07:13  (1시간 앞당김)
    - cron: '13 7 * * *'
  workflow_dispatch:

# 예약 실행과 수동 실행(또는 앞 회차 지연)이 겹쳐 동시에 돌지 않도록 직렬화한다.
# cancel-in-progress: false → 진행 중 작업은 끝까지 두고, 다음 실행은 대기.
concurrency:
  group: daily-briefing
  cancel-in-progress: false

# docs/index.html 을 저장소에 커밋해야 하므로 쓰기 권한 필요
permissions:
  contents: write

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          # 사이트 발행 on/off
          PUBLISH_SITE: '1'
          # 사이트가 잘 뜨는 걸 확인한 뒤 '0' 으로 바꾸면 메일 발송이 꺼진다
          SEND_EMAIL: '1'
          SITE_URL: 'https://kkkkkijun.github.io/stock_news_mailer/'
        run: python main.py
      - name: Publish site (commit docs/index.html)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          git diff --staged --quiet || git commit -m "site: 브리핑 갱신 [skip ci]"
          # 원격에 다른 커밋이 있으면 rebase 후 푸시(충돌로 발행이 유실되지 않도록)
          git pull --rebase --autostash origin main || true
          git push
