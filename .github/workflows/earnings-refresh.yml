name: Earnings Refresh (Reports + Schedule)

# 실적 발표(SEC 8-K) 직후 빠르게 반영. 뉴스·메일 없이 실적/시세/보고서만 갱신 후 재빌드.
on:
  schedule:
    - cron: '30 22 * * *'   # 07:30 KST (미 장마감 실적 반영)
    - cron: '30 23 * * *'   # 08:30 KST
    - cron: '0 0 * * *'     # 09:00 KST
    - cron: '30 12 * * *'   # 21:30 KST (미 장전 실적)
  # 보고서 로직을 고쳐 main에 푸시하면 바로 새 규칙으로 다시 만들어 배포(REPORT_GEN을 올린 경우 최근 보고서 전체)
  push:
    branches: [main]
    paths:
      - 'earnings.py'
      - 'report_agents.py'
      - 'report_check.py'
      - 'render/earnings.py'
      - '.github/workflows/earnings-refresh.yml'
  workflow_dispatch:
    inputs:
      retry:
        description: '보류된 보고서를 다시 만들 티커(콤마 구분, 예: NVDA,HIMS) 또는 all — 비우면 평소대로'
        required: false
        default: ''

concurrency:
  group: daily-briefing      # 브리핑과 직렬화(동시 커밋 충돌 방지)
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 대기열에서 기다린 실행도 '시작 시점의 최신 main'에서 출발(옛 커밋 기준이면 데이터 커밋이 충돌)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install -r requirements.txt
      - name: Refresh earnings/reports
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REPORT_MODEL: ${{ vars.OPENAI_REPORT_MODEL }}
          REPORT_RETRY: ${{ inputs.retry }}
        run: python main.py refresh
      - name: Report status
        if: always()
        run: python tools/report_status.py
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          git diff --staged --quiet || git commit -m "refresh: 실적/보고서 갱신 [skip ci]"
          # GitHub 쪽 일시 오류(500 Internal Server Error)나 동시 푸시 충돌 대비: 최대 3번 재시도
          for i in 1 2 3; do
            git pull --rebase --autostash origin main || true
            git push && exit 0
            echo "push 실패($i/3) — $((i*15))초 후 재시도"; sleep $((i*15))
          done
          exit 1
