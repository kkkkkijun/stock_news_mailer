name: Map Refresh (Ostium + Hyperliquid + 홈 히트맵)

on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [map-refresh]

concurrency:
  group: map-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Snapshot RWA + whales + home heatmap
        run: |
          python rwa.py refresh
          python whales.py refresh
          python treemap.py || echo "treemap 실패(기존 파일 유지)"
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rwamap.json docs/whales.json data/whale_list.json docs/treemap.json
          git diff --staged --quiet || git commit -m "map: 지도 스냅샷 [skip ci]"
          git pull --rebase --autostash origin main || true
          git push
