name: Map Refresh (Ostium + Hyperliquid)

on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:

concurrency:
  group: map-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install deps
        run: pip install requests
      - name: Snapshot RWA + whales
        run: |
          python rwa.py refresh
          python whales.py refresh
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rwamap.json docs/whales.json data/whale_list.json
          git diff --staged --quiet || git commit -m "map: 지도 스냅샷 [skip ci]"
          git pull --rebase --autostash origin main || true
          git push
