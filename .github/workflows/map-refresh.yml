name: Map Refresh (Ostium + Hyperliquid + 홈 히트맵)

# 매시 정각 cron-job.org → repository_dispatch로 실행. (GitHub 자체 schedule은 수십 분씩 늦게 돌아
#  정각 실행과 겹치며 Pages 배포 충돌을 일으켜 제거)
on:
  workflow_dispatch:
  repository_dispatch:
    types: [map-refresh]

concurrency:
  group: map-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Snapshot RWA + whales + home heatmap
        run: |
          python rwa.py refresh
          python whales.py refresh
          python treemap.py || echo "treemap 실패(기존 파일 유지)"
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rwamap.json docs/whales.json data/whale_list.json docs/treemap.json
          git diff --staged --quiet || git commit -m "map: 지도 스냅샷 [skip ci]"
          # GitHub 쪽 일시 오류(500 Internal Server Error)나 동시 푸시 충돌 대비: 최대 3번 재시도
          for i in 1 2 3; do
            git pull --rebase --autostash origin main || true
            git push && exit 0
            echo "push 실패($i/3) — $((i*15))초 후 재시도"; sleep $((i*15))
          done
          exit 1
