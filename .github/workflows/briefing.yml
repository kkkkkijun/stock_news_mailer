name: Daily Briefing (Site + Push)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [news-briefing]

concurrency:
  group: daily-briefing
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REPORT_MODEL: ${{ vars.OPENAI_REPORT_MODEL }}
          # SEND_EMAIL=1 일 때만 사용(기본 꺼짐)
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUBLISH_SITE: '1'
          SEND_EMAIL: '0'
          SITE_URL: 'https://kkkkkijun.github.io/stock_news_mailer/'
        run: python main.py
      - name: Publish site (commit docs/index.html)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          git diff --staged --quiet || git commit -m "site: 브리핑 갱신 [skip ci]"
          # GitHub 쪽 일시 오류(500 Internal Server Error)나 동시 푸시 충돌 대비: 최대 3번 재시도
          for i in 1 2 3; do
            git pull --rebase --autostash origin main || true
            git push && exit 0
            echo "push 실패($i/3) — $((i*15))초 후 재시도"; sleep $((i*15))
          done
          exit 1
