name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "data/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt pyflakes
      - name: Lint
        run: python -m pyflakes *.py render/*.py tools/*.py tests/*.py airflow/dags/*.py
      - name: Tests
        run: python -m pytest -q
