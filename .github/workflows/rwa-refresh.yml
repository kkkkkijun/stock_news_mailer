name: RWA Map Refresh (Ostium)

on:
  schedule:
    # 30분마다 온체인 RWA 포지션 스냅샷
    - cron: '15 * * * *'
  workflow_dispatch:

concurrency:
  group: rwa-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install deps
        run: pip install requests
      - name: Snapshot RWA map
        run: python rwa.py refresh
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rwamap.json
          git diff --staged --quiet || git commit -m "rwa: 지도 스냅샷 [skip ci]"
          git pull --rebase --autostash origin main || true
          git push
